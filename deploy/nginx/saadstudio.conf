# Alternative to deploy/Caddyfile for hosts that already run nginx.
#
# Caddy is the default in docker-compose.yml because it obtains and renews
# certificates on its own. Use this file instead only if nginx is already
# terminating TLS on the box; do not run both.
#
# Install:
#   cp deploy/nginx/saadstudio.conf /etc/nginx/sites-available/saadstudio
#   ln -s /etc/nginx/sites-available/saadstudio /etc/nginx/sites-enabled/
#   certbot --nginx -d saadstudio.app -d www.saadstudio.app
#   nginx -t && systemctl reload nginx
#
# certbot rewrites the listen/ssl_certificate lines below on first run.

upstream saad_app {
    # The loopback binding published by docker-compose.yml.
    server 127.0.0.1:3000;
    keepalive 32;
}

# Canonicalise to the apex: both hostnames are in getAllowedOrigins() in
# lib/security.ts, and one origin keeps sessions and CORS consistent.
server {
    listen 80;
    listen [::]:80;
    server_name saadstudio.app www.saadstudio.app;

    # certbot's HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://saadstudio.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.saadstudio.app;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/saadstudio.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/saadstudio.app/privkey.pem;

    return 301 https://saadstudio.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saadstudio.app;

    # ssl_certificate     /etc/letsencrypt/live/saadstudio.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/saadstudio.app/privkey.pem;

    # next.config.mjs sets serverActions.bodySizeLimit to 10mb. 25m here leaves
    # room for multipart overhead; large media is meant to go straight to B2/R2
    # over a signed URL rather than through the app.
    client_max_body_size 25m;

    # Security headers are set per-response by middleware.ts (CSP, COOP, CORP,
    # X-Frame-Options, Permissions-Policy) and are deliberately not repeated
    # here — two sources for one header is how CSP breaks in production. HSTS is
    # the one worth adding at the edge.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://saad_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket/upgrade passthrough.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The studio export, video-extend stitch and transitions stitch routes
        # run ffmpeg inside the request and are declared at 300s in vercel.json.
        # nginx defaults to 60s, which would return 504 while the job is still
        # running. 360s leaves headroom for the response to be written.
        proxy_connect_timeout 10s;
        proxy_send_timeout    360s;
        proxy_read_timeout    360s;

        # Streaming responses must not be held in a buffer.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Immutable build output: let the browser and any CDN keep it.
    location /_next/static/ {
        proxy_pass http://saad_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
