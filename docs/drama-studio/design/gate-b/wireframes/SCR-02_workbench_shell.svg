<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg-main"/>
  
  <rect x="0" y="0" width="1440" height="56" class="bg-card stroke-border"/>
  <text x="24" y="34" class="text-main" font-size="14" font-weight="bold">SAAD STUDIO</text>
  <text x="135" y="34" class="text-dim" font-size="16">/</text>
  <rect x="155" y="10" width="310" height="36" rx="6" class="bg-card-hover stroke-cyan"/>
  <circle cx="175" cy="28" r="4" class="bg-emerald"/>
  <text x="188" y="32" class="text-main" font-size="12" font-weight="bold">صقور الصحراء (Desert Hawks)</text>
  <rect x="380" y="16" width="55" height="24" rx="4" class="bg-main stroke-cyan"/>
  <text x="390" y="32" class="text-cyan" font-size="10">Active</text>
  <rect x="490" y="14" width="130" height="28" rx="4" class="bg-main stroke-border"/>
  <text x="502" y="32" class="text-emerald" font-size="11">💾 Saved (Autosave)</text>
  <text x="640" y="34" class="text-muted" font-size="12">Ep 01 > Scene 01 > Beat 1.2 > Shot 03</text>
  <rect x="910" y="12" width="220" height="32" rx="6" class="bg-main stroke-border"/>
  <text x="920" y="32" class="text-cyan" font-size="11">Target: 3m | Planned: 3m 15s</text>
  <rect x="1145" y="12" width="165" height="32" rx="6" class="bg-card-hover stroke-violet"/>
  <text x="1155" y="32" class="text-violet" font-size="11">⚡ Cap: 280 / 500 Cr</text>
  <rect x="1320" y="12" width="100" height="32" rx="6" class="bg-card stroke-border-light"/>
  <text x="1335" y="32" class="text-main" font-size="11">🎨 Board</text>
  <rect x="0" y="56" width="600" height="844" class="bg-card stroke-border"/>
  <text x="24" y="90" class="text-main" font-size="14" font-weight="bold">مخرج سعد ستوديو (Director Agent Panel - 42%)</text>
  <rect x="600" y="56" width="840" height="844" class="bg-main stroke-border"/>
  <text x="630" y="90" class="text-main" font-size="14" font-weight="bold">Management Workspace (58% — 5 Named Tabs)</text>

</svg>