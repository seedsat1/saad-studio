<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg-main"/>
  
  <!-- Top Navbar -->
  <rect x="0" y="0" width="1440" height="48" class="bg-card stroke-border"/>
  <text x="24" y="30" class="text-main" font-size="14" font-weight="bold">SAAD STUDIO</text>
  <text x="140" y="30" class="text-muted" font-size="12">Explore</text>
  <text x="210" y="30" class="text-cyan" font-size="12" font-weight="bold">Video (Drama Studio)</text>
  <text x="360" y="30" class="text-muted" font-size="12">Audio</text>
  <text x="420" y="30" class="text-muted" font-size="12">Image</text>
  <text x="1280" y="30" class="text-main" font-size="12">Credits: 450</text>

  <!-- Hero Section (Locked Backdrop & Title) -->
  <rect x="60" y="70" width="1320" height="260" rx="12" class="bg-card stroke-border"/>
  <text x="90" y="115" class="text-cyan" font-size="12" font-weight="bold">SAAD DRAMA STUDIO • AI MICRODRAMA PRODUCTION</text>
  <text x="90" y="155" class="text-main" font-size="26" font-weight="bold">اصنع مسلسلات وأفلام ذكاء اصطناعي سينمائية متكاملة</text>
  <text x="90" y="185" class="text-muted" font-size="13">استوديو إخراج متكامل يجمع بين كتابة السيناريو، بناء الشخصيات، وضبط الاستمرارية والإنتاج متعدد اللقطات.</text>

  <!-- Project Launcher Quick Action Bar (Extension) -->
  <rect x="90" y="215" width="200" height="44" rx="8" class="bg-cyan"/>
  <text x="135" y="242" class="text-main" font-size="13" font-weight="bold">+ مشروع جديد (New Project)</text>

  <rect x="305" y="215" width="180" height="44" rx="8" class="bg-card stroke-border-light"/>
  <text x="340" y="242" class="text-main" font-size="13">📂 فتح مشروع (Open)</text>

  <rect x="500" y="215" width="200" height="44" rx="8" class="bg-main stroke-cyan"/>
  <text x="535" y="242" class="text-cyan" font-size="13">🗂️ عرض كل المشاريع (All)</text>

  <!-- Section 1: User's Recent Projects (Integrated Project System) -->
  <text x="60" y="375" class="text-main" font-size="18" font-weight="bold">مشاريعك الأخيرة (Recent Projects)</text>
  <text x="1220" y="375" class="text-cyan" font-size="13" font-weight="bold">عرض كل المشاريع (View All 8) →</text>

  <!-- Project Card 1 (Active Production with Job) -->
  <rect x="60" y="400" width="310" height="210" rx="10" class="bg-card stroke-cyan" stroke-width="1.5"/>
  <rect x="60" y="400" width="310" height="100" rx="10" class="bg-card-hover"/>
  <text x="75" y="430" class="text-cyan" font-size="11" font-weight="bold">[ Poster: Keyframe 01 ]</text>
  <rect x="255" y="410" width="105" height="22" rx="4" class="bg-main stroke-cyan"/>
  <text x="265" y="425" class="text-cyan" font-size="10" font-weight="bold">● In Production</text>
  <text x="75" y="525" class="text-main" font-size="14" font-weight="bold">صقور الصحراء (Desert Hawks)</text>
  <text x="75" y="545" class="text-muted" font-size="11">Episode 1 • 3 Scenes • Planned: 3m 15s</text>
  <text x="75" y="570" class="text-violet" font-size="10">⚡ Generating Take 2 (Block 1.3) • Spent: 42 Cr</text>
  <text x="75" y="595" class="text-dim" font-size="10">آخر تعديل: منذ 15 دقيقة</text>

  <!-- Project Card 2 (Planning Draft) -->
  <rect x="395" y="400" width="310" height="210" rx="10" class="bg-card stroke-border"/>
  <rect x="395" y="400" width="310" height="100" rx="10" class="bg-main"/>
  <text x="410" y="430" class="text-dim" font-size="11">[ Poster: Fallback Identity ]</text>
  <rect x="615" y="410" width="80" height="22" rx="4" class="bg-main stroke-border-light"/>
  <text x="635" y="425" class="text-muted" font-size="10">Planning</text>
  <text x="410" y="525" class="text-main" font-size="14" font-weight="bold">مهمة سرية (Secret Mission)</text>
  <text x="410" y="545" class="text-muted" font-size="11">Single Episode • 5 Scenes • Target: 1m</text>
  <text x="410" y="570" class="text-emerald" font-size="10">✓ Settings Approved • Spent: 0 Cr</text>
  <text x="410" y="595" class="text-dim" font-size="10">آخر تعديل: أمس 09:30 PM</text>

  <!-- Project Card 3 (Completed Project) -->
  <rect x="730" y="400" width="310" height="210" rx="10" class="bg-card stroke-border"/>
  <rect x="730" y="400" width="310" height="100" rx="10" class="bg-card-hover"/>
  <text x="745" y="430" class="text-emerald" font-size="11">[ Poster: Final Master Frame ]</text>
  <rect x="940" y="410" width="90" height="22" rx="4" class="bg-main stroke-border-light"/>
  <text x="955" y="425" class="text-emerald" font-size="10">✓ Completed</text>
  <text x="745" y="525" class="text-main" font-size="14" font-weight="bold">خيوط الظلام (Shadow Threads)</text>
  <text x="745" y="545" class="text-muted" font-size="11">Episode 1 • Final Duration: 2m 45s</text>
  <text x="745" y="570" class="text-muted" font-size="10">Exported 4K Master • Total: 180 Cr</text>
  <text x="745" y="595" class="text-dim" font-size="10">آخر تعديل: منذ 3 أيام</text>

  <!-- Project Card 4 (New Project Card Placeholder) -->
  <rect x="1065" y="400" width="315" height="210" rx="10" class="bg-main stroke-border-light" stroke-dasharray="6,4"/>
  <text x="1170" y="495" class="text-cyan" font-size="28">+</text>
  <text x="1140" y="530" class="text-main" font-size="13" font-weight="bold">إنشاء مشروع جديد</text>
  <text x="1120" y="555" class="text-dim" font-size="11">ابدأ بمسلسل أو فيلم قصير جديد</text>

  <!-- Section 2: Featured Microdramas (Separate from User Projects) -->
  <text x="60" y="660" class="text-main" font-size="16" font-weight="bold">معرض الأعمال الملهمة (Featured Microdramas &amp; Community Showcase)</text>
  <rect x="60" y="680" width="245" height="180" rx="8" class="bg-card stroke-border"/>
  <text x="80" y="770" class="text-muted" font-size="12">Poster Showcase 1</text>
  <rect x="330" y="680" width="245" height="180" rx="8" class="bg-card stroke-border"/>
  <text x="350" y="770" class="text-muted" font-size="12">Poster Showcase 2</text>
  <rect x="600" y="680" width="245" height="180" rx="8" class="bg-card stroke-border"/>
  <text x="620" y="770" class="text-muted" font-size="12">Poster Showcase 3</text>
  <rect x="870" y="680" width="245" height="180" rx="8" class="bg-card stroke-border"/>
  <text x="890" y="770" class="text-muted" font-size="12">Poster Showcase 4</text>
  <rect x="1140" y="680" width="240" height="180" rx="8" class="bg-card stroke-border"/>
  <text x="1160" y="770" class="text-muted" font-size="12">Poster Showcase 5</text>

</svg>