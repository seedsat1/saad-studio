<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#070A11; font-family:'Segoe UI', system-ui, sans-serif;">
  <!-- Backdrop Overlay -->
  <rect width="1440" height="900" fill="#000000" fill-opacity="0.8"/>

  <!-- Modal Container -->
  <rect x="420" y="200" width="600" height="460" rx="16" fill="#0E1626" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header -->
  <path d="M 420 216 Q 420 200 436 200 L 1004 200 Q 1020 200 1020 216 L 1020 260 L 420 260 Z" fill="#152033"/>
  <text x="450" y="238" fill="#F8FAFC" font-size="16" font-weight="bold">STA-01: PREPARING STATE OVERLAY (Transient Modal)</text>
  <rect x="940" y="220" width="60" height="24" rx="4" fill="#334155" fill-opacity="0.4"/>
  <text x="955" y="236" fill="#94A3B8" font-size="11">DRAFT</text>

  <!-- Animated Aura & Icon -->
  <circle cx="720" cy="330" r="45" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="720" cy="330" r="30" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="708" y="338" fill="#06B6D4" font-size="24">🎬</text>

  <!-- Status Steps -->
  <text x="520" y="415" fill="#38BDF8" font-size="14" font-weight="bold">1. تحليل الفكرة وصياغة المعالجة الدرامية</text>
  <text x="910" y="415" fill="#06B6D4" font-size="12">[ 100% اكتمل ]</text>
  
  <text x="520" y="450" fill="#E2E8F0" font-size="14" font-weight="bold">2. ضبط النمط البصري ومعايير الشخصيات</text>
  <text x="910" y="450" fill="#38BDF8" font-size="12">[ جاري الضبط... ]</text>
  
  <text x="520" y="485" fill="#64748B" font-size="14">3. تجهيز مقترح مساحة العمل للمشروع</text>
  <text x="910" y="485" fill="#64748B" font-size="12">[ بانتظار 2 ]</text>

  <!-- Progress Bar -->
  <rect x="470" y="525" width="500" height="8" rx="4" fill="#1E293B"/>
  <rect x="470" y="525" width="340" height="8" rx="4" fill="#06B6D4"/>

  <!-- Footer Actions -->
  <rect x="470" y="580" width="120" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="510" y="605" fill="#94A3B8" font-size="13">إلغاء (Cancel)</text>

  <rect x="850" y="580" width="120" height="40" rx="8" fill="#06B6D4"/>
  <text x="875" y="605" fill="#FFFFFF" font-size="13" font-weight="bold">متابعة الآن</text>

  <!-- Note -->
  <text x="490" y="645" fill="#64748B" font-size="11">Design Decision: Approved as transient state, not a standalone route.</text>
</svg>
