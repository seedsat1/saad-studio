<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#070A11; font-family:'Segoe UI', system-ui, sans-serif;">
  <!-- Backdrop -->
  <rect width="1440" height="900" fill="#000000" fill-opacity="0.8"/>

  <!-- Left Modal: MDL-08 Save a Copy As -->
  <rect x="100" y="160" width="580" height="580" rx="14" fill="#0E1626" stroke="#1E293B" stroke-width="2"/>
  <path d="M 100 174 Q 100 160 114 160 L 666 160 Q 680 160 680 174 L 680 215 L 100 215 Z" fill="#152033"/>
  <text x="130" y="195" fill="#F8FAFC" font-size="15" font-weight="bold">MDL-08: حفظ نسخة كـمشروع مستقل (Save a Copy As)</text>

  <text x="130" y="255" fill="#E2E8F0" font-size="13" font-weight="bold">اسم المشروع الجديد (New Independent Project Title):</text>
  <rect x="130" y="270" width="520" height="42" rx="6" fill="#070A11" stroke="#06B6D4"/>
  <text x="145" y="297" fill="#F8FAFC" font-size="13">صقور الصحراء - نسخة التوزيع السينمائي (v2 Cut)</text>

  <rect x="130" y="330" width="520" height="130" rx="8" fill="#152033" stroke="#1E293B"/>
  <text x="145" y="355" fill="#38BDF8" font-size="11" font-weight="bold">قواعد الاستقلالية المعمارية (Architectural Isolation):</text>
  <text x="145" y="380" fill="#94A3B8" font-size="10">• سيتم إنشاء projectId مستقل وجديد تماماً.</text>
  <text x="145" y="405" fill="#94A3B8" font-size="10">• لن يتم نقل سجل المعاملات المالية السابقة (يبدأ المشروع الجديد بسجل تكلفة نظيف).</text>
  <text x="145" y="430" fill="#94A3B8" font-size="10">• يتم نسخ مسودة المشاهد والشخصيات دون مشاركة أي حالة قابلة للتعديل بين المشروعين.</text>

  <rect x="130" y="480" width="520" height="70" rx="8" fill="#070A11" stroke="#334155"/>
  <text x="145" y="510" fill="#E2E8F0" font-size="11">نسخ الأصول المعتمدة: [ ✓ تضمين الشخصيات والبيئات كنسخ مرجعية ]</text>
  <text x="145" y="535" fill="#64748B" font-size="10">المشروع الأصلي: صقور الصحراء (ID: proj_8921a) لن يتأثر مطلقاً.</text>

  <rect x="130" y="660" width="130" height="40" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="170" y="685" fill="#94A3B8" font-size="12">إلغاء (Cancel)</text>

  <rect x="470" y="660" width="180" height="40" rx="6" fill="#06B6D4"/>
  <text x="495" y="685" fill="#FFFFFF" font-size="12" font-weight="bold">إنشاء النسخة المستقلة ←</text>

  <!-- Right Modal: MDL-09 Multi-Session Conflict Resolver -->
  <rect x="760" y="160" width="580" height="580" rx="14" fill="#0E1626" stroke="#D97706" stroke-width="2"/>
  <path d="M 760 174 Q 760 160 774 160 L 1326 160 Q 1340 160 1340 174 L 1340 215 L 760 215 Z" fill="#1A150B"/>
  <text x="790" y="195" fill="#F59E0B" font-size="15" font-weight="bold">MDL-09: تعارض في حفظ المشروع (Multi-Session Conflict)</text>

  <text x="790" y="250" fill="#F8FAFC" font-size="13" font-weight="bold">تم اكتشاف تعديل أحدث للمشروع من جلسة أو جهاز آخر:</text>
  <text x="790" y="275" fill="#94A3B8" font-size="11">المشروع: صقور الصحراء • تم التعديل بواسطة: Browser Session (MacBook Pro) منذ 3 دقائق.</text>

  <!-- Comparison Box -->
  <rect x="790" y="295" width="520" height="85" rx="6" fill="#070A11" stroke="#334155"/>
  <text x="805" y="320" fill="#38BDF8" font-size="11" font-weight="bold">1. نسختك المحلية الحالية (Current Local Version):</text>
  <text x="805" y="340" fill="#E2E8F0" font-size="10">آخر تعديل محلي: 10:48 AM • المشاهد: 3 • اللقطات: 8 • حوار Shot 03 معدل</text>
  <text x="805" y="365" fill="#64748B" font-size="10">Status: Unsaved local buffer</text>

  <rect x="790" y="395" width="520" height="85" rx="6" fill="#070A11" stroke="#06B6D4"/>
  <text x="805" y="420" fill="#10B981" font-size="11" font-weight="bold">2. النسخة المحفوظة على السيرفر (Latest Cloud Version):</text>
  <text x="805" y="440" fill="#E2E8F0" font-size="10">آخر تعديل على السيرفر: 10:50 AM • المشاهد: 4 • اللقطات: 10 (تمت إضافة مشهد الخزنة)</text>
  <text x="805" y="465" fill="#10B981" font-size="10">Status: Verified Snapshot v1.4</text>

  <!-- 4 Action Resolutions -->
  <text x="790" y="505" fill="#E2E8F0" font-size="12" font-weight="bold">اختر إجراء الحل (Resolution Action):</text>

  <rect x="790" y="520" width="520" height="35" rx="6" fill="#152033" stroke="#334155"/>
  <text x="805" y="542" fill="#E2E8F0" font-size="11">A. تحميل أحدث نسخة من السيرفر (Load Latest Cloud Version - Recommended)</text>

  <rect x="790" y="565" width="520" height="35" rx="6" fill="#152033" stroke="#334155"/>
  <text x="805" y="587" fill="#E2E8F0" font-size="11">B. الاحتفاظ بالنسخة المحلية وتجاوز السيرفر (Keep Current Local Version)</text>

  <rect x="790" y="610" width="520" height="35" rx="6" fill="#0F172A" stroke="#06B6D4"/>
  <text x="805" y="632" fill="#38BDF8" font-size="11">C. حفظ نسختك المحلية كمشروع جديد مستقل (Save Local as New Copy)</text>

  <rect x="1110" y="670" width="200" height="40" rx="6" fill="#06B6D4"/>
  <text x="1145" y="695" fill="#FFFFFF" font-size="12" font-weight="bold">تأكيد حل التعارض ←</text>
</svg>
