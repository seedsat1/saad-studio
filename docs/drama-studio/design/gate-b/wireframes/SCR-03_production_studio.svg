<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg-main"/>
  
  <rect x="0" y="0" width="1440" height="48" class="bg-card stroke-border"/>
  <text x="24" y="30" class="text-cyan" font-size="12" font-weight="bold">← Back to Workbench</text>
  <text x="200" y="30" class="text-main" font-size="13" font-weight="bold">SCR-03: PRODUCTION STUDIO • Ep 01 > Scene 01 > Beat 1.2 > Shot 03</text>
  <rect x="0" y="48" width="56" height="852" class="bg-card stroke-border"/>
  <circle cx="28" cy="75" r="16" class="bg-card-hover stroke-cyan"/>
  <text x="22" y="80" class="text-cyan" font-size="12">🎨</text>
  <circle cx="28" cy="115" r="16" class="bg-card-hover stroke-cyan"/>
  <text x="22" y="120" class="text-cyan" font-size="12">👤</text>
  <rect x="56" y="48" width="750" height="480" class="bg-main stroke-border"/>
  <text x="80" y="80" class="text-cyan" font-size="13" font-weight="bold">Shot 03 Prompt &amp; Script Editor</text>
  <rect x="80" y="100" width="700" height="110" rx="6" class="bg-card stroke-border-light"/>
  <text x="95" y="140" class="text-main" font-size="12">"Cinematic close-up on @Character_01 in dark neon rain, camera pushes in."</text>
  <rect x="806" y="48" width="634" height="480" class="bg-card stroke-border"/>
  <rect x="830" y="70" width="585" height="280" rx="8" class="bg-main stroke-border-light"/>
  <text x="1060" y="215" class="text-dim" font-size="14">[ Video Preview Canvas 16:9 ]</text>
  <rect x="56" y="528" width="1384" height="372" class="bg-card stroke-border"/>
  <text x="75" y="555" class="text-cyan" font-size="12" font-weight="bold">Hierarchical Timeline LTR &amp; 7 Audio Lanes</text>

</svg>