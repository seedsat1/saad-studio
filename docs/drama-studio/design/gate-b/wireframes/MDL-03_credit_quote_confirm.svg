<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 740" width="700" height="740">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="700" height="740" class="bg-main"/>
  
  <rect width="700" height="740" rx="16" class="bg-card stroke-cyan" stroke-width="2"/>
  <path d="M 0 16 Q 0 0 16 0 L 684 0 Q 700 0 700 16 L 700 50 L 0 50 Z" class="bg-card-hover"/>
  <text x="30" y="32" class="text-main" font-size="15" font-weight="bold">MDL-03: تأكيد التوليد وحجز الرصيد (Credit Quote &amp; Confirmation)</text>
  <rect x="30" y="70" width="640" height="50" rx="8" class="bg-main stroke-border"/>
  <text x="45" y="100" class="text-muted" font-size="11">رصيد الحساب: <tspan class="text-cyan" font-weight="bold">450 Cr</tspan> | سقف المشروع: <tspan class="text-violet" font-weight="bold">500 Cr</tspan></text>
  <text x="30" y="150" class="text-main" font-size="13" font-weight="bold">تفاصيل تسعير العملية الحالية (Dynamic Itemized Breakdown):</text>
  <rect x="30" y="170" width="640" height="200" rx="8" class="bg-main stroke-border"/>
  <text x="50" y="205" class="text-main" font-size="12">1. توليد الفيديو الأساسي (5s @ 1080p):</text><text x="580" y="205" class="text-cyan" font-size="12">10 Credits</text>
  <text x="50" y="240" class="text-main" font-size="12">2. المحاولة الإضافية (Take 2):</text><text x="580" y="240" class="text-cyan" font-size="12">+ 8 Credits</text>
  <text x="50" y="275" class="text-main" font-size="12">3. بصمة الصوت والحوار (@Zaid_Voice):</text><text x="580" y="275" class="text-violet" font-size="12">+ 2 Credits</text>
  <text x="50" y="310" class="text-main" font-size="12">4. المؤثرات الصوتية والمحيط:</text><text x="580" y="310" class="text-cyan" font-size="12">+ 1 Credit</text>
  <rect x="420" y="660" width="250" height="44" rx="8" class="bg-cyan"/>
  <text x="445" y="687" class="text-main" font-size="13" font-weight="bold">تأكيد وحجز 21 نقطة وبدء التوليد ←</text>

</svg>