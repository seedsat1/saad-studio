  <text x="20" y="290" class="text-emerald" font-size="12">6. Audio Track: Voice ID @Zaid_Voice 100% matched [PASS]</text>
  <text x="20" y="330" class="text-emerald" font-size="12">7. Technical Track: 1080p 24fps matched [PASS]</text>

</svg>