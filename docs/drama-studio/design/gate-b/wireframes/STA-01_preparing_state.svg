<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg-main"/>
  
  <rect width="1440" height="900" class="bg-main" fill-opacity="0.85"/>
  <rect x="420" y="200" width="600" height="460" rx="16" class="bg-card stroke-border" stroke-width="2"/>
  <path d="M 420 216 Q 420 200 436 200 L 1004 200 Q 1020 200 1020 216 L 1020 260 L 420 260 Z" class="bg-card-hover"/>
  <text x="450" y="238" class="text-main" font-size="16" font-weight="bold">STA-01: PREPARING STATE OVERLAY (Transient Modal)</text>
  <circle cx="720" cy="330" r="45" class="bg-main stroke-cyan" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="708" y="338" class="text-cyan" font-size="24">🎬</text>
  <text x="520" y="415" class="text-cyan" font-size="14" font-weight="bold">1. تحليل الفكرة وصياغة المعالجة الدرامية</text>
  <text x="910" y="415" class="text-emerald" font-size="12">[ 100% اكتمل ]</text>
  <text x="520" y="450" class="text-main" font-size="14" font-weight="bold">2. ضبط النمط البصري ومعايير الشخصيات</text>
  <text x="910" y="450" class="text-cyan" font-size="12">[ جاري الضبط... ]</text>
  <text x="520" y="485" class="text-dim" font-size="14">3. تجهيز مقترح مساحة العمل للمشروع</text>
  <text x="910" y="485" class="text-dim" font-size="12">[ بانتظار 2 ]</text>
  <rect x="470" y="525" width="500" height="8" rx="4" class="bg-main"/>
  <rect x="470" y="525" width="340" height="8" rx="4" class="bg-cyan"/>
  <rect x="470" y="580" width="120" height="40" rx="8" class="bg-card stroke-border-light"/>
  <text x="510" y="605" class="text-muted" font-size="13">إلغاء</text>
  <rect x="850" y="580" width="120" height="40" rx="8" class="bg-cyan"/>
  <text x="875" y="605" class="text-main" font-size="13" font-weight="bold">متابعة الآن</text>

</svg>