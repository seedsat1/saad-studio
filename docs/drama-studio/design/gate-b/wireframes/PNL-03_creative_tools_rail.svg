<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 852" width="56" height="852">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="56" height="852" class="bg-main"/>
  
  <rect width="56" height="852" class="bg-card stroke-border"/>
  <circle cx="28" cy="40" r="16" class="bg-card-hover stroke-cyan"/><text x="20" y="45" class="text-cyan" font-size="11">1. 🎨</text>
  <circle cx="28" cy="90" r="16" class="bg-card-hover stroke-cyan"/><text x="20" y="95" class="text-cyan" font-size="11">2. 👤</text>
  <circle cx="28" cy="140" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="145" class="text-muted" font-size="11">3. 📦</text>
  <circle cx="28" cy="190" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="195" class="text-muted" font-size="11">4. 🏛️</text>
  <circle cx="28" cy="240" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="245" class="text-muted" font-size="11">5. 🌈</text>
  <circle cx="28" cy="290" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="295" class="text-muted" font-size="11">6. ✨</text>
  <circle cx="28" cy="340" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="345" class="text-muted" font-size="11">7. 🎥</text>
  <circle cx="28" cy="390" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="395" class="text-muted" font-size="11">8. ✏️</text>
  <circle cx="28" cy="440" r="16" class="bg-card-hover stroke-border-light"/><text x="20" y="445" class="text-muted" font-size="11">9. 🎬</text>

</svg>