      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
