<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="360" class="bg-main"/>
  
  <rect width="600" height="360" rx="8" class="bg-card stroke-border"/>
  <text x="20" y="35" class="text-violet" font-size="13" font-weight="bold">MDL-01: PROPOSED CHANGE (Scope: Ep 01 / Scene 02)</text>
  <rect x="20" y="60" width="560" height="50" rx="4" class="bg-main stroke-border"/>
  <text x="35" y="90" class="text-rose" font-size="11">- Before: Scene 02 planned as static guard shot (35s)</text>
  <rect x="20" y="125" width="560" height="50" rx="4" class="bg-main stroke-cyan"/>
  <text x="35" y="155" class="text-emerald" font-size="11">+ After: Split into 2 dynamic Beats: Laser bypass &amp; Vault open (25s)</text>
  <text x="20" y="210" class="text-cyan" font-size="11">Impact: Continuity [PASS] | Duration [-10s] | Cost [0 Cr]</text>
  <rect x="20" y="240" width="160" height="35" rx="6" class="bg-cyan"/>
  <text x="45" y="262" class="text-main" font-size="11" font-weight="bold">اعتماد وتطبيق التعديل</text>

</svg>