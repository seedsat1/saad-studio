<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg-main"/>
  
  <rect x="0" y="0" width="1440" height="48" class="bg-card stroke-border"/>
  <text x="24" y="30" class="text-cyan" font-size="12" font-weight="bold">← Back to Production Room</text>
  <text x="220" y="30" class="text-main" font-size="14" font-weight="bold">SUB-01: ASSEMBLY, PREVIEW &amp; FINAL EXPORT (7-Step Pipeline)</text>
  <rect x="40" y="70" width="1360" height="780" rx="12" class="bg-card stroke-border"/>
  <text x="70" y="115" class="text-cyan" font-size="16" font-weight="bold">7-Step Assembly Pipeline:</text>
  <text x="70" y="150" class="text-main" font-size="13">1. Normalization ──► 2. Trimming ──► 3. Straight Cuts ──► 4. Audio Mix ──► 5. Captions ──► 6. Preview ──► 7. Master Render</text>
  <rect x="70" y="180" width="800" height="450" rx="8" class="bg-main stroke-border-light"/>
  <text x="400" y="415" class="text-dim" font-size="16">[ Assembly Preview Player ]</text>
  <rect x="900" y="180" width="460" height="450" rx="8" class="bg-card-hover stroke-border"/>
  <text x="920" y="215" class="text-main" font-size="14" font-weight="bold">Export Configuration (Dynamic Central Codecs):</text>
  <text x="920" y="250" class="text-muted" font-size="12">Container: MP4 / MOV | Codec: H.264 / ProRes (Registry Driven)</text>
  <text x="920" y="280" class="text-muted" font-size="12">Final Duration: 2m 45s | Audio: Stereo Mastered</text>
  <rect x="920" y="550" width="420" height="50" rx="8" class="bg-cyan"/>
  <text x="1050" y="582" class="text-main" font-size="14" font-weight="bold">تصدير الماستر النهائي (Export Master) 🎬</text>

</svg>