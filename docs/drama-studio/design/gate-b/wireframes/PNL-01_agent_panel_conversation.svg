<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <style>
      :root {
        --ss-bg: #070A11;
        --ss-card: #0E1626;
        --ss-card-hover: #152033;
        --ss-cyan: #06B6D4;
        --ss-cyan-light: #38BDF8;
        --ss-violet: #8B5CF6;
        --ss-violet-light: #A78BFA;
        --ss-amber: #D97706;
        --ss-amber-light: #F59E0B;
        --ss-emerald: #10B981;
        --ss-rose: #EF4444;
        --ss-border: #1E293B;
        --ss-border-light: #334155;
        --ss-text-main: #F8FAFC;
        --ss-text-muted: #94A3B8;
        --ss-text-dim: #64748B;
      }
      .bg-main { fill: var(--ss-bg); }
      .bg-card { fill: var(--ss-card); }
      .bg-card-hover { fill: var(--ss-card-hover); }
      .bg-cyan { fill: var(--ss-cyan); }
      .bg-violet { fill: var(--ss-violet); }
      .bg-amber { fill: var(--ss-amber); }
      .stroke-border { stroke: var(--ss-border); }
      .stroke-border-light { stroke: var(--ss-border-light); }
      .stroke-cyan { stroke: var(--ss-cyan); }
      .stroke-violet { stroke: var(--ss-violet); }
      .stroke-amber { stroke: var(--ss-amber); }
      .text-main { fill: var(--ss-text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-muted { fill: var(--ss-text-muted); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-dim { fill: var(--ss-text-dim); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-cyan { fill: var(--ss-cyan-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-violet { fill: var(--ss-violet-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-amber { fill: var(--ss-amber-light); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-emerald { fill: var(--ss-emerald); font-family: 'Segoe UI', system-ui, sans-serif; }
      .text-rose { fill: var(--ss-rose); font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="900" class="bg-main"/>
  
  <rect width="600" height="900" class="bg-card stroke-border"/>
  <rect x="0" y="0" width="600" height="56" class="bg-card-hover stroke-border"/>
  <circle cx="24" cy="28" r="5" class="bg-emerald"/>
  <text x="38" y="32" class="text-main" font-size="14" font-weight="bold">مخرج سعد ستوديو (Director Agent)</text>
  <rect x="20" y="80" width="560" height="120" rx="8" class="bg-main stroke-border"/>
  <text x="35" y="110" class="text-cyan" font-size="12" font-weight="bold">Director Agent:</text>
  <text x="35" y="135" class="text-main" font-size="12">"قمت بتهيئة النمط الافتراضي للمشروع. هل تود تقسيم المشهد الثاني إلى Beats إضافية؟"</text>
  <rect x="0" y="810" width="600" height="90" class="bg-card-hover stroke-border"/>
  <rect x="20" y="825" width="560" height="46" rx="8" class="bg-main stroke-border-light"/>
  <text x="40" y="853" class="text-dim" font-size="12">اكتب رسالتك للمخرج... اسأل عن القصة أو اطلب تعديلاً</text>

</svg>