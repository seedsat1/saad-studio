  <text x="650" y="305" class="text-main" font-size="13" font-weight="bold">SCENE 01: Ext. Alleyway - Rain (الشارع الخلفي)</text>
  <text x="650" y="325" class="text-dim" font-size="10">Target: 20s | Planned: 22s | Continuity: [PASS] | References: @Zaid_Character, @Cyber_Alley</text>
