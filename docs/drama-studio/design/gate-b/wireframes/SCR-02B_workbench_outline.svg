  <rect x="600" y="48" width="840" height="852" class="bg-main"/>
  <rect x="630" y="115" width="780" height="150" rx="8" class="bg-card stroke-border"/>
  <text x="650" y="145" class="text-cyan" font-size="15" font-weight="bold">1. EPISODE 01: The Midnight Breach (الحلقة الأولى)</text>
  <text x="650" y="170" class="text-muted" font-size="11">3. Synopsis: A lone operative infiltrates a high-security vault in downtown Dubai.</text>
