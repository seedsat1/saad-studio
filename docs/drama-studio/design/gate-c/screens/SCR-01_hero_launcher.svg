<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <style>
    :root {
      --ss-bg: #060c18;
      --ss-card: #0f1a35;
      --ss-card-hover: #162447;
      --ss-border: #1f305c;
      --ss-cyan: #06b6d4;
      --ss-cyan-glow: rgba(6, 182, 212, 0.15);
      --ss-violet: #8b5cf6;
      --ss-violet-glow: rgba(139, 92, 246, 0.15);
      --ss-pink: #ec4899;
      --ss-text: #e2e8f0;
      --ss-muted: #94a3b8;
      --ss-amber: #f59e0b;
      --ss-amber-glow: rgba(245, 158, 11, 0.15);
      --ss-green: #10b981;
      --ss-green-glow: rgba(16, 185, 129, 0.15);
      --ss-red: #ef4444;
      --ss-red-glow: rgba(239, 68, 68, 0.15);
    }
    .bg { fill: var(--ss-bg); }
    .card { fill: var(--ss-card); stroke: var(--ss-border); stroke-width: 1; }
    .card-hover { fill: var(--ss-card-hover); stroke: var(--ss-cyan); stroke-width: 1.5; }
    .card-active { fill: var(--ss-card); stroke: var(--ss-cyan); stroke-width: 2; }
    .card-violet { fill: var(--ss-card); stroke: var(--ss-violet); stroke-width: 1.5; }
    .card-amber { fill: var(--ss-card); stroke: var(--ss-amber); stroke-width: 1.5; }
    .card-green { fill: var(--ss-card); stroke: var(--ss-green); stroke-width: 1.5; }
    .card-red { fill: var(--ss-card); stroke: var(--ss-red); stroke-width: 1.5; }
    .header-bar { fill: var(--ss-card); stroke: var(--ss-border); stroke-width: 1; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: var(--ss-text); }
    .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--ss-text); }
    .text-secondary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: var(--ss-muted); }
    .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: var(--ss-muted); }
    .text-cyan { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ss-cyan); }
    .text-violet { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ss-violet); }
    .text-amber { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ss-amber); }
    .text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ss-green); }
    .text-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ss-red); }
    .btn-cyan { fill: var(--ss-cyan); rx: 6; }
    .btn-cyan-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: var(--ss-bg); }
    .btn-outline { fill: transparent; stroke: var(--ss-border); stroke-width: 1; rx: 6; }
    .btn-outline-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ss-text); }
    .badge-cyan { fill: var(--ss-cyan-glow); stroke: var(--ss-cyan); stroke-width: 1; rx: 4; }
    .badge-violet { fill: var(--ss-violet-glow); stroke: var(--ss-violet); stroke-width: 1; rx: 4; }
    .badge-amber { fill: var(--ss-amber-glow); stroke: var(--ss-amber); stroke-width: 1; rx: 4; }
    .badge-green { fill: var(--ss-green-glow); stroke: var(--ss-green); stroke-width: 1; rx: 4; }
    .badge-red { fill: var(--ss-red-glow); stroke: var(--ss-red); stroke-width: 1; rx: 4; }
  </style>
  <rect width="1440" height="900" class="bg" />
  
      <rect x="0" y="0" width="1440" height="60" class="header-bar" />
      <text x="32" y="36" class="text-title">Saad Studio</text>
      <text x="260" y="36" class="text-cyan">Drama Studio (Active)</text>
      <rect x="1300" y="14" width="108" height="32" class="badge-cyan" />
      <text x="1316" y="34" class="text-cyan">💳 1,250 Cr</text>

      <rect x="120" y="90" width="1200" height="280" class="card-violet" rx="12" />
      <text x="160" y="140" class="text-title" style="font-size: 24px;">🎬 Drama Studio — AI Microdrama Production</text>
      <text x="160" y="175" class="text-secondary" style="font-size: 14px;">Locked &amp; Approved Hero with Project Launcher Extension</text>
      <rect x="160" y="210" width="800" height="48" class="card" rx="8" />
      <text x="180" y="240" class="text-muted">Describe your drama concept, screenplay prompt, or episode brief...</text>
      <rect x="880" y="218" width="70" height="32" class="btn-cyan" />
      <text x="898" y="238" class="btn-cyan-text">Start</text>

      <text x="120" y="410" class="text-title" style="font-size: 20px;">Project Launcher &amp; Recent Workspaces</text>
      <rect x="120" y="435" width="280" height="320" class="card" rx="8" stroke-dasharray="4" />
      <circle cx="260" cy="560" r="30" class="badge-cyan" />
      <text x="250" y="568" class="text-cyan" style="font-size: 24px;">+</text>
      <text x="200" y="620" class="text-title">New Drama Project</text>

      <rect x="425" y="435" width="280" height="320" class="card-hover" rx="8" />
      <rect x="425" y="435" width="280" height="150" fill="var(--ss-border)" rx="8" />
      <text x="565" y="520" class="text-muted" style="text-anchor: middle;">[ Auto Poster Take 1 ]</text>
      <text x="440" y="615" class="text-title">Shadows of Riyadh: Ep 1</text>
      <text x="440" y="640" class="text-secondary">3 Scenes • 12 Shots • Target: 120s</text>
      <rect x="440" y="695" width="250" height="36" class="btn-cyan" /><text x="525" y="718" class="btn-cyan-text">Open Workbench</text>

      <rect x="730" y="435" width="280" height="320" class="card" rx="8" />
      <rect x="730" y="435" width="280" height="150" fill="var(--ss-border)" rx="8" />
      <text x="870" y="520" class="text-muted" style="text-anchor: middle;">[ Placeholder Poster ]</text>
      <text x="745" y="615" class="text-title">The Desert Merchant</text>
      <text x="745" y="640" class="text-secondary">Outline Draft • 4 Characters</text>
      <rect x="745" y="695" width="250" height="36" class="btn-outline" /><text x="825" y="718" class="btn-outline-text">Open Workbench</text>

      <rect x="1035" y="435" width="285" height="320" class="card" rx="8" />
      <text x="1060" y="480" class="text-title">All Drama Projects</text>
      <text x="1060" y="510" class="text-secondary">Full repository overlay &amp; soft-delete recovery.</text>
      <rect x="1060" y="695" width="235" height="36" class="btn-outline" /><text x="1115" y="718" class="btn-outline-text">View All Projects (Overlay)</text>
    
</svg>